[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saddlellm"
version = "2.35"
description = "LLM training, fine-tuning, alignment, multimodal learning, world models, evaluation, and deployment toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "niqinggood", email = "niqinggood@163.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "packaging>=23,<27",
  "PyYAML>=6,<7",
]

[project.scripts]
saddle-llm = "saddlellm.cli:main"
saddlellm = "saddlellm.cli:main"

[project.optional-dependencies]
train = [
  "torch>=2.6,<3.0",
  "transformers>=4.57.6,<5.0",
  "datasets>=3.6,<4.0",
  "accelerate>=1.12,<2.0",
  "evaluate>=0.4,<1",
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
  "tqdm>=4.66,<5",
]
posttrain = [
  "torch>=2.6,<3.0",
  "transformers==4.57.6",
  "datasets==3.6.0",
  "peft==0.18.1",
  "trl==0.26.2",
  "accelerate==1.12.0",
  "huggingface-hub==0.36.2",
  "tokenizers==0.22.2",
  "pyarrow==18.1.0",
  "packaging==26.2",
  "PyYAML==6.0.3",
  "evaluate==0.4.6",
  "numpy==1.26.4",
  "Pillow==12.3.0",
  "tqdm==4.67.3",
]
qlora = [
  "bitsandbytes>=0.45,<1",
]
serve = [
  "torch>=2.6,<3.0",
  "transformers>=4.57.6,<5.0",
  "accelerate>=1.12,<2.0",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.10,<3",
]
spatial = [
  "torch>=2.6,<3.0",
  "transformers>=4.57.6,<5.0",
  "accelerate>=1.12,<2.0",
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.20,<1",
  "pydantic>=2.10,<3",
]
monitor = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.10,<3",
  "psutil>=6,<8",
  "nvidia-ml-py>=12,<14",
  "prometheus-client>=0.21,<1",
  "prometheus-fastapi-instrumentator>=7,<8",
]
data = [
  "datasketch",
  "langdetect",
  "pyarrow",
  "simhash",
]
text = [
  "beautifulsoup4",
  "chardet",
  "dateparser",
  "emoji",
  "ftfy",
  "jieba",
  "nltk",
  "pandarallel",
  "pandas",
  "pypinyin",
  "rapidfuzz",
  "scikit-learn",
  "sentence-transformers",
  "slimit",
  "unidecode",
  "zhconv",
  "zstandard",
]
dev = [
  "build>=1.2,<2",
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["saddlellm", "saddlellm.*", "saddle_llm", "saddle_llm.*"]
namespaces = false

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
saddlellm = [
  "spatial_studio_web/*",
  "spatial_studio_web/assets/*",
]
