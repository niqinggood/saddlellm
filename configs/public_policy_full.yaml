train_steps: 200
num_generations: 4
train_temperature: 1.0
train_top_p: 0.95
train_max_new_tokens: 96
max_prompt_length: 1024
max_sequence_length: 1152
max_response_chars: 3000
learning_rate: 0.00005
beta: 0.02
epsilon: 0.2
per_device_batch_size: 1
gradient_accumulation_steps: 2
profile_source_prompts: true
train_on_informative_only: true

lora_rank: 8
lora_alpha: 16
lora_dropout: 0.0
seed: 42
save_adapter: true
