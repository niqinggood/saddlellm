project: saddlellm
experiment: text-to-image-latent-flow

# The upstream cache stage must create these two arrays:
#   latents:    float32 [samples, channels, height, width]
#   conditions: float32 [samples, text_condition_dim]
stages: [image_generation]

image_generation:
  enabled: true
  data_path: data/image_latents.npz
  output_dir: image_flow
  codec_name: external-image-vae
  condition_encoder: external-text-encoder
  patch_size: 2
  hidden_size: 512
  num_layers: 8
  num_heads: 8
  mlp_ratio: 4.0
  batch_size: 4
  epochs: 10
  max_steps: -1
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_steps: 100
  gradient_accumulation_steps: 4
  checkpoint_steps: 500
  device: auto
  mixed_precision: bf16

logging:
  output_dir: outputs/text-to-image-flow
  backend: local

eval:
  enabled: false
