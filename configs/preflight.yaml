project: saddlellm
experiment: preflight-check
stages: [sft, eval]

model:
  name_or_path: Qwen/Qwen2.5-7B-Instruct
  tokenizer: Qwen/Qwen2.5-7B-Instruct
  backend: hf
pretrain_mode: continue

sft:
  enabled: true
  data_path: data/posttrain_sft_example.jsonl
  use_lora: true
  use_qlora: false
  max_seq_length: 1024
  per_device_batch_size: 1

eval:
  enabled: true

training:
  max_steps: 100
  dry_run: true
  preflight_only: true

distributed:
  strategy: single

logging:
  output_dir: outputs/preflight
  backend: local
