# Story-domain, Chinese-only continuation on the bilingual 16k model.
project: saddle-tinystories-bilingual
experiment: tiny-stories-zh-story-focus
seed: 44
stages: [pretrain]
pretrain_mode: continue

model:
  backend: saddle
  config: tinystories-bilingual-16k
  name_or_path: outputs/tinystories_saddle_tiny_20260923_bilingual16k/zh_continue/final_model
  tokenizer: outputs/tinystories_saddle_tiny_20260923_bilingual16k/zh_continue/final_model
  local_files_only: true
  blueprint:
    name: tinystories-bilingual-16k
    family: qwen
    hidden_size: 256
    vocab_size: 16384
    num_layers: 6
    max_position_embeddings: 256
    tie_word_embeddings: true
    attention:
      kind: gqa
      backend: sdpa
      num_heads: 4
      num_kv_heads: 2
      rope_theta: 10000.0
    ffn:
      kind: swiglu
      intermediate_size: 704
    residual:
      topology: serial
      initialization: depth_scaled
      dropout: 0.0
    objective:
      causal_lm: true
      multi_token_prediction: false

data:
  sources:
    - type: local
      path: outputs/tinystories_saddle_tiny_20260923_vocab16k/assets/chinese_stories.jsonl
      text_column: text
      streaming: false
  output_dir: outputs/tinystories_saddle_tiny_20260923_bilingual16k/zh_story_processed
  max_seq_length: 256
  min_text_length: 80
  dedup_method: exact
  quality_min_score: 0.0
  num_proc: 1
  pack_sequences: true
  append_eos: true
  validation_split: 0.05

training:
  max_steps: 4000
  per_device_batch_size: 4
  global_batch_size: 8
  learning_rate: 0.00002
  min_lr: 0.000002
  lr_scheduler: cosine
  warmup_steps: 100
  weight_decay: 0.05
  max_grad_norm: 1.0
  optimizer: adamw_torch
  eval_every_steps: 400
  save_every_steps: 800
  keep_last_n_checkpoints: 3
  log_every_steps: 50
  load_best_model_at_end: true
  gradient_checkpointing: false
  loss_chunk_size: 128
  dataloader_num_workers: 0
  stability_monitor: true

distributed:
  strategy: single
  num_gpus: 1
  num_nodes: 1
  bf16: true
  fp16: false

logging:
  output_dir: outputs/tinystories_saddle_tiny_20260923_bilingual16k/zh_story_tune
  backend: local
