# 28.3M Chinese-first base model: broad-corpus phase (about 500M token positions).
# The corpus builder writes source licenses, filters and hashes to:
# E:/ml_data/saddlellm_pretrain/zh_28m_v3_600m/corpus_manifest.json
project: saddle-zh-28m
experiment: zh-28m-v3-phase1-500m
seed: 42
stages: [pretrain]
pretrain_mode: scratch

model:
  backend: saddle
  config: zh-32k-28m-v3
  tokenizer: outputs/zh_en_small_pretrain_v2_20260923/tokenizer32k
  local_files_only: true
  blueprint:
    name: zh-32k-28m-v3
    family: qwen
    hidden_size: 384
    vocab_size: 32768
    num_layers: 10
    max_position_embeddings: 512
    tie_word_embeddings: true
    attention:
      kind: gqa
      backend: sdpa
      num_heads: 6
      num_kv_heads: 2
      rope_theta: 10000.0
    ffn:
      kind: swiglu
      intermediate_size: 1024
    residual:
      topology: serial
      initialization: depth_scaled
      dropout: 0.0
    objective:
      causal_lm: true
      multi_token_prediction: false

data:
  sources:
    - type: local
      path: E:/ml_data/saddlellm_pretrain/zh_28m_v3_600m/mixed_train.jsonl
      text_column: text
      streaming: false
  output_dir: E:/ml_data/saddlellm_pretrain/zh_28m_v3_600m/processed_phase1_256
  cache_dir: E:/ml_data/saddlellm_pretrain/.cache/huggingface
  max_seq_length: 256
  min_text_length: 20
  dedup_method: exact
  quality_min_score: 0.0
  num_proc: 4
  pack_sequences: true
  append_eos: true
  validation_split: 0.001

training:
  # 30500 * 64 * 256 = 499,712,000 training-token positions.
  max_steps: 30500
  per_device_batch_size: 64
  global_batch_size: 64
  learning_rate: 0.0004
  min_lr: 0.00004
  lr_scheduler: cosine
  warmup_steps: 500
  weight_decay: 0.1
  max_grad_norm: 1.0
  optimizer: adamw_torch
  eval_every_steps: 2500
  save_every_steps: 5000
  keep_last_n: 3
  log_every_steps: 25
  load_best_model_at_end: true
  gradient_checkpointing: false
  loss_chunk_size: 512
  dataloader_num_workers: 4
  stability_monitor: true

distributed:
  strategy: single
  num_gpus: 1
  num_nodes: 1
  bf16: true
  fp16: false
  tf32: true

logging:
  output_dir: outputs/zh_28m_pretrain_v3/phase1_500m
  backend: local
