project: saddlellm
experiment: categorical-rssm-world-model-example
backend: categorical_rssm

# observation_shape and action_dim may be omitted and inferred from the data.
model:
  observation_shape: [4]
  action_dim: 2
  action_type: continuous
  embedding_size: 32
  deterministic_size: 64
  stochastic_size: 8
  stochastic_classes: 8
  hidden_size: 64
  mlp_layers: 2
  recurrent_blocks: 4
  activation: silu
  uniform_mix: 0.01
  symlog_observations: true
  reward_bins: 51
  reward_bin_low: -10.0
  reward_bin_high: 10.0
  reconstruction_weight: 1.0
  reward_weight: 1.0
  continuation_weight: 1.0
  dynamics_kl_weight: 1.0
  representation_kl_weight: 0.1
  free_nats: 1.0

data:
  train_path: data/world_model_example.jsonl
  sequence_length: 6
  stride: 3
  validation_split: 0.25
  normalize_images: true
  pad_short_trajectories: true

training:
  output_dir: outputs/world_model_categorical_example
  num_epochs: 10
  batch_size: 4
  learning_rate: 0.0003
  weight_decay: 0.00001
  gradient_accumulation_steps: 1
  max_grad_norm: 100.0
  warmup_steps: 1
  max_steps: -1
  mixed_precision: auto
  device: auto
  num_workers: 0
  log_steps: 1
  checkpoint_steps: 25
  seed: 42
