project: saddlellm
experiment: raw-image-to-flow
stages: [media_cache, image_generation]

media_cache:
  enabled: true
  jobs:
    - input_path: data/image_generation_manifest.jsonl
      output_dir: image_cache
      modality: image
      codec_name: baseline-rgb-image
      codec_config:
        height: 32
        width: 32
      text_encoder: hash
      text_encoder_config:
        dimension: 256
      shard_size: 256
      strict: true
      resume: true

image_generation:
  enabled: true
  # data_path is omitted: the stage consumes the upstream image cache.
  output_dir: image_flow
  patch_size: 2
  hidden_size: 512
  num_layers: 8
  num_heads: 8
  batch_size: 4
  epochs: 10
  learning_rate: 0.0001
  checkpoint_steps: 500
  device: auto
  mixed_precision: bf16

logging:
  output_dir: outputs/raw-image-to-flow
  backend: local

eval:
  enabled: false
