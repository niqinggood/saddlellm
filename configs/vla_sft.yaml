project: saddlellm
experiment: vla-sft
stage: vla_sft
model:
  name_or_path: Qwen/Qwen2.5-7B-Instruct
  tokenizer: Qwen/Qwen2.5-7B-Instruct
  backend: hf
  pretrain_mode: continue
data:
  sources:
    - type: local
      path: data/robot.jsonl
      format: jsonl
  max_seq_length: 2048
vla:
  enabled: true
  data_path: data/robot.jsonl
  image_root: data/images
  action_dim: 7
  action_bins: 256
  control_hz: 10
  coordinate_frame: end_effector_delta
  train: false
  use_lora: true
training:
  preflight_only: false
  per_device_batch_size: 1
  global_batch_size: 8
  learning_rate: 0.0002
  epochs: 1
  max_steps: 1000
logging:
  output_dir: outputs/vla_sft
  backend: local
