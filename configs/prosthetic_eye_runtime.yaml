eye_control:
  safety:
    yaw_limits: [-0.65, 0.65]
    pitch_limits: [-0.45, 0.45]
    max_velocity: [1.8, 1.4]
    max_acceleration: [10.0, 8.0]
    max_current: [1.5, 1.5]
    max_temperature_c: 55.0
    soft_limit_margin: [0.08, 0.06]
    neutral_position: [0.0, 0.0]
    fallback_max_velocity: [0.45, 0.35]
    target_timeout_seconds: 0.25

  pid:
    kp: [3.0, 3.0]
    ki: [0.15, 0.15]
    kd: [0.18, 0.18]
    integral_limit: [0.35, 0.35]
    deadband_radians: [0.004, 0.004]

  plant:
    dt: 0.02
    velocity_time_constant: [0.06, 0.07]
    motor_acceleration_limit: [14.0, 11.0]
    command_deadband: 0.015
    idle_current: [0.04, 0.04]
    acceleration_current_gain: [0.045, 0.055]
    velocity_current_gain: [0.06, 0.07]
    ambient_temperature_c: 24.0
    thermal_heating_rate: 0.12
    thermal_cooling_rate: 0.08
    sensor_noise_std: 0.001

  planner:
    horizon: 10
    num_candidates: 128
    iterations: 4
    elite_fraction: 0.1
    discount: 0.99
    continuation_aware: true
    action_low: [-1.0, -1.0]
    action_high: [1.0, 1.0]
    minimum_std: 0.05
    momentum: 0.1
    seed: 42
