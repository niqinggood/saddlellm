project: saddlellm
experiment: sft-lora
stage: sft
model:
  name_or_path: Qwen/Qwen2.5-7B-Instruct
  tokenizer: Qwen/Qwen2.5-7B-Instruct
  backend: hf
  pretrain_mode: continue
method:
  type: lora
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]
data:
  sources:
    - type: local
      path: data/posttrain_sft_example.jsonl
      format: jsonl
  max_seq_length: 2048
training:
  per_device_batch_size: 1
  global_batch_size: 16
  learning_rate: 0.0002
  epochs: 3
  max_steps: 1000
  warmup_steps: 100
  save_every_steps: 200
  eval_every_steps: 0
backend:
  strategy: auto
  num_gpus: 1
  gpu_memory_gb: 24
logging:
  output_dir: outputs/sft_lora
  backend: local
