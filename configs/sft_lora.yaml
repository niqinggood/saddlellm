project: saddlellm
experiment: sft-lora
stages: [sft, eval]

model:
  name_or_path: Qwen/Qwen2.5-7B-Instruct
  tokenizer: Qwen/Qwen2.5-7B-Instruct
  backend: hf
pretrain_mode: continue

sft:
  enabled: true
  data_path: data/posttrain_sft_example.jsonl
  use_lora: true
  use_qlora: false
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: [q_proj, k_proj, v_proj, o_proj]
  epochs: 3
  learning_rate: 0.0002
  per_device_batch_size: 1
  max_seq_length: 2048
  gradient_accumulation_steps: 4

eval:
  enabled: true

training:
  max_steps: 1000
  warmup_steps: 100
  save_every_steps: 200

distributed:
  strategy: single
  num_gpus: 1

logging:
  output_dir: outputs/sft_lora
  backend: local
