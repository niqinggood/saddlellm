name: Quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check release metadata
        run: python tools/check_release_consistency.py
      - name: Check generated function reference
        run: python tools/generate_function_reference.py --check
      - name: Build and inspect wheel
        run: |
          python -m pip install --upgrade build
          python -m build
          python tools/check_wheel_contents.py dist/*.whl
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -I -c "import saddlellm; print(saddlellm.__version__)"
          saddle-llm --help

  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-posttrain.txt
            requirements-test.txt
      - name: Install CPU test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-test.txt
          python -m pip install -e . --no-deps
      - name: Run Python tests
        run: |
          python -m ruff check saddlellm tests tools --select F601,F821,F822,F823
          python -m pytest -q

  spatial-studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spatial-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: spatial-studio/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
