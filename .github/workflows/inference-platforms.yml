name: Inference platform smoke

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inference-platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: deploy/constraints-serve.txt
      - name: CPU torch on Windows/Linux
        if: runner.os != 'macOS'
        run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: macOS torch (CPU checks only)
        if: runner.os == 'macOS'
        run: python -m pip install torch==2.6.0
      - name: Install serving and test dependencies
        run: python -m pip install -e ".[serve,dev]" -c deploy/constraints-serve.txt
      - name: Native inference, streaming, scheduler and device-routing regression
        run: >-
          python -m pytest -q
          tests/test_native_generation_session.py
          tests/test_native_batch_decode.py
          tests/test_native_sampling_batch.py
          tests/test_native_independent_kv.py
          tests/test_native_stream_batching.py
          tests/test_native_dispatch.py
          tests/test_native_streaming.py
          tests/test_inference_cache.py
          tests/test_sliding_window_cache.py
          tests/test_inference_token_scheduling.py
          tests/test_inference_stream_metrics.py
          tests/test_inference_batching.py
          tests/test_inference_disconnect.py
          tests/test_batch_generation_control.py
          tests/test_inference_platforms.py
          tests/test_serving_benchmark.py
          tests/test_doctor_profiles.py
          tests/test_chat_history_policy.py
          tests/test_native_architectures.py
          tests/test_native_reference_attention.py
          --tb=short

  installed-wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the distributable
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Install CPU runtime and wheel without editable source
        shell: pwsh
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheel = (Get-ChildItem dist/*.whl).FullName
          python -m pip install "${wheel}[serve]" "openai>=1.109,<3" "httpx>=0.27,<1" -c deploy/constraints-serve.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real loopback SDK smoke outside source tree
        working-directory: ${{ runner.temp }}
        shell: pwsh
        run: |
          python -I "$env:GITHUB_WORKSPACE/tools/smoke_installed_wheel.py" --source-root "$env:GITHUB_WORKSPACE" --output "$env:RUNNER_TEMP/installed-wheel-smoke.json"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-wheel-${{ matrix.os }}
          path: ${{ runner.temp }}/installed-wheel-smoke.json

  container-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build CPU inference image
        run: docker build -t saddlellm-inference:ci .
      - name: Check installed CLI
        run: docker run --rm saddlellm-inference:ci --help
      - name: Real native generation inside container
        run: >-
          docker run --rm --entrypoint python saddlellm-inference:ci
          -c "import torch; from saddlellm.models.SaddleModeling import SaddleForCausalLM,SaddleModelConfig;
          m=SaddleForCausalLM(SaddleModelConfig(vocab_size=16,hidden_size=16,intermediate_size=32,num_hidden_layers=1,num_attention_heads=4,num_key_value_heads=2,max_position_embeddings=16,eos_token_id=[])).eval();
          y=m.generate(torch.tensor([[3,4]]),max_new_tokens=2,do_sample=False); assert y.shape==(1,4); print('native CPU generation OK')"
