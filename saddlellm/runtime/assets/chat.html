<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f8">
  <title>{{PAGE_TITLE}}</title>
  <link rel="stylesheet" href="/assets/chat.css?v=6">
  <link rel="stylesheet" href="/assets/saddle-intro.css?v=1">
  <link rel="stylesheet" href="/assets/katex/katex.min.css?v=0.18.9">
  <script src="/assets/marked.min.js?v=14" defer></script>
  <script src="/assets/katex/katex.min.js?v=0.18.9" defer></script>
  <script src="/assets/chat.js?v=9" defer></script>
  <script src="/assets/saddle-intro.js?v=1" defer></script>
</head>
<body data-default-max-tokens="{{DEFAULT_MAX_TOKENS}}" data-max-tokens="{{MAX_TOKENS}}" data-history-enabled="true">
  <div class="app-shell">
    <div class="mobile-backdrop" id="mobileBackdrop" hidden></div>
    <aside class="sidebar" id="sidebar" aria-label="对话侧栏">
      <div class="brand" aria-label="SaddleLLM">
        <div class="brand-copy"><strong>SaddleLLM</strong></div>
        <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="收起侧栏" aria-controls="sidebar" aria-expanded="true" title="收起侧栏"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16"/></svg></button>
      </div>

      <nav class="saddle-nav" aria-label="Web 页面导航">
        <a class="saddle-nav-link" id="saddleChatNav" href="/" aria-label="模型问答" title="模型问答"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a8.5 8.5 0 0 1-8.5 8.5 9 9 0 0 1-3.5-.7L3 21l1.7-5A8.5 8.5 0 1 1 20 11.5Z"/></svg><span>模型问答</span></a>
        <a class="saddle-nav-link" id="saddleIntroNav" href="/saddle" aria-label="SaddleLLM 介绍" title="SaddleLLM 介绍"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5c-3-2-6-2-9-1v15c3-1 6-1 9 1 3-2 6-2 9-1V4c-3-1-6-1-9 1Z"/><path d="M12 5v15M6 8h3M6 11h3M15 8h3M15 11h3"/></svg><span>SaddleLLM 介绍</span></a>
      </nav>

      <button class="new-chat" id="newChat" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span>新建对话</span>
      </button>

      <div class="sidebar-section">
        <span class="section-label">当前会话</span>
        <div class="session-item" aria-current="page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a8.5 8.5 0 0 1-8.5 8.5 9 9 0 0 1-3.5-.7L3 21l1.7-5A8.5 8.5 0 1 1 20 11.5Z"/></svg>
          <span id="sessionTitle">新对话</span>
        </div>
        <span class="section-label history-label">历史记录</span>
        <div class="history-list" id="historyList" aria-label="历史对话列表"></div>
        <p class="session-hint" id="sessionHint">历史保存在启动命令所在目录（共享工作区）</p>
      </div>

      <div class="sidebar-bottom">
        <div class="sidebar-status"><span class="status-dot" id="sidebarDot"></span><div><strong id="sidebarStatus">正在连接</strong><small id="sidebarModel">正在读取模型…</small></div></div>
        <button class="sidebar-settings" id="sidebarSettings" type="button" aria-haspopup="dialog" aria-controls="settingsPanel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.86l.05.05-2.88 2.88-.05-.05A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1.04 1.56V21h-4v-.04A1.7 1.7 0 0 0 8.92 19.4a1.7 1.7 0 0 0-1.86.34l-.05.05-2.88-2.88.05-.05A1.7 1.7 0 0 0 4.52 15 1.7 1.7 0 0 0 3 13.96H3v-4h.04A1.7 1.7 0 0 0 4.6 8.92a1.7 1.7 0 0 0-.34-1.86l-.05-.05 2.88-2.88.05.05A1.7 1.7 0 0 0 9 4.52 1.7 1.7 0 0 0 10.04 3h3.92A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.86-.34l.05-.05 2.88 2.88-.05.05A1.7 1.7 0 0 0 19.4 9 1.7 1.7 0 0 0 21 10.04v3.92A1.7 1.7 0 0 0 19.4 15Z"/></svg>
          <span>设置</span>
        </button>
      </div>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <button class="icon-button mobile-menu" id="mobileMenu" type="button" aria-label="打开侧栏" aria-controls="sidebar" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <div class="model-heading"><strong id="modelName">正在连接模型…</strong><span id="topStatus"><span class="status-dot"></span><span id="health">连接中</span></span></div>
        <button class="icon-button top-settings" id="topSettings" type="button" aria-label="模型设置" aria-haspopup="dialog" aria-controls="settingsPanel" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.86l.05.05-2.88 2.88-.05-.05A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1.04 1.56V21h-4v-.04A1.7 1.7 0 0 0 8.92 19.4a1.7 1.7 0 0 0-1.86.34l-.05.05-2.88-2.88.05-.05A1.7 1.7 0 0 0 4.52 15 1.7 1.7 0 0 0 3 13.96H3v-4h.04A1.7 1.7 0 0 0 4.6 8.92a1.7 1.7 0 0 0-.34-1.86l-.05-.05 2.88-2.88.05.05A1.7 1.7 0 0 0 9 4.52 1.7 1.7 0 0 0 10.04 3h3.92A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.86-.34l.05-.05 2.88 2.88-.05.05A1.7 1.7 0 0 0 19.4 9 1.7 1.7 0 0 0 21 10.04v3.92A1.7 1.7 0 0 0 19.4 15Z"/></svg></button>
      </header>

      <section id="saddleIntro" aria-label="SaddleLLM 介绍" hidden><!-- SADDLE_INTRO --></section>

      <div class="conversation" id="conversation" role="log" aria-label="对话消息" aria-live="polite">
        <div class="welcome" id="welcome">
          <h1>开始对话</h1>
          <p><span id="welcomeModel">模型</span> 已就绪。输入问题，开始交流。</p>
        </div>
        <div class="messages" id="messages"></div>
      </div>

      <div class="composer-area">
        <form class="composer" id="form">
          <label class="sr-only" for="message">输入问题</label>
          <textarea id="message" rows="1" placeholder="发送消息" aria-label="输入问题，Enter 发送，Shift+Enter 换行"></textarea>
          <div class="composer-actions"><span>Enter 发送 · Shift+Enter 换行</span><button class="send-button" id="send" type="submit" aria-label="发送消息"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg><span>发送</span></button><button class="stop-button" id="stop" type="button" hidden>停止生成</button></div>
        </form>
        <p class="disclaimer">模型回答仅供参考；医疗、护理等高风险结论须由专业人员复核。请勿输入敏感信息。</p>
      </div>
    </main>

    <div class="settings-backdrop" id="settingsBackdrop" hidden></div>
    <section class="settings-panel" id="settingsPanel" role="dialog" aria-modal="false" aria-labelledby="settingsTitle" hidden>
      <div class="settings-header"><h2 id="settingsTitle">模型设置</h2><button class="icon-button" id="closeSettings" type="button" aria-label="关闭设置"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5 5 19"/></svg></button></div>
      <div class="settings-body">
        <label class="field"><span>当前模型</span><input id="settingsModel" type="text" readonly></label>
        <div class="field"><div class="field-heading"><label for="temperature">温度</label><output id="temperatureValue" for="temperature">0.2</output></div><input id="temperature" type="range" min="0" max="2" step="0.1" value="0.2"><small>值越高，回答越灵活；值越低，回答越稳定。</small></div>
        <label class="field"><span>最长回答（token）</span><input id="maxTokens" type="number" min="1" max="{{MAX_TOKENS}}" value="{{DEFAULT_MAX_TOKENS}}" inputmode="numeric"><small>上限由服务启动参数决定。</small></label>
        <label class="field"><span>API Key（可选）</span><input id="apiKey" type="password" autocomplete="off" placeholder="服务启用鉴权时填写"><small>仅用于当前页面请求，不会保存在浏览器中。</small></label>
      </div>
      <div class="settings-actions"><button class="secondary-button" id="cancelSettings" type="button">取消</button><button class="primary-button" id="saveSettings" type="button">保存设置</button></div>
    </section>
  </div>
</body>
</html>
